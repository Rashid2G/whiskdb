name: Performance Benchmark & PR Impact

on:
  pull_request:
    branches: [master, main]
  workflow_dispatch:
    inputs:
      target_branch:
        description: "Target branch to benchmark against"
        required: false
        default: "master"

permissions:
  contents: read
  pull-requests: write

jobs:
  benchmark:
    name: Compare Persistence Performance
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Code with Full History
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++-14 libsqlite3-dev

      - name: Run Cross-Branch Persistence Benchmark
        id: bench
        env:
          CC: gcc-14
          CXX: g++-14
        run: |
          TARGET="${{ github.base_ref || inputs.target_branch || 'master' }}"
          echo "Comparing PR against baseline target: $TARGET"

          python3 scripts/benchmark_branch.py \
            --target "$TARGET" \
            --base "HEAD" \
            --quick \
            --threshold 15.0 \
            --output-markdown benchmark_report.md \
            --output-json benchmark_report.json

      - name: Publish Benchmark Summary to Workflow Step
        if: always() && hashFiles('benchmark_report.md') != ''
        run: |
          cat benchmark_report.md >> $GITHUB_STEP_SUMMARY

      - name: Report Performance Impact to Pull Request
        if: github.event_name == 'pull_request' && hashFiles('benchmark_report.md') != ''
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('benchmark_report.md', 'utf8');
            const marker = '<!-- WHISKDB_PERF_BENCHMARK_REPORT -->';
            const body = `${marker}\n${report}`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existingComment = comments.find(c => c.body && c.body.includes(marker));
            if (existingComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existingComment.id,
                body: body,
              });
              console.log(`Updated existing benchmark comment ID ${existingComment.id}`);
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: body,
              });
              console.log('Created new benchmark PR comment');
            }
