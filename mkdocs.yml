site_name: WhiskDB
site_description: In-Memory SQL Database with In-Engine Code Execution & High-Performance Persistence
site_author: WhiskDB Team
repo_url: https://github.com/Rashid2G/whiskdb
repo_name: Rashid2G/whiskdb

theme:
  name: mkdocs
  color_mode: dark
  user_color_mode_toggle: true

extra_css:
  - css/custom.css

markdown_extensions:
  - admonition
  - tables
  - fenced_code
  - codehilite:
      guess_lang: false
  - toc:
      permalink: "#"
  - attr_list
  - def_list

nav:
  - Home: index.md
  - User Guide: user-guide.md
  - Developer Guide: developer-guide.md
  - Development Status: development.md
