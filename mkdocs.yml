site_name: WhiskDB
site_description: In-memory relational database with co-located WebAssembly execution and configurable WAL persistence
site_author: WhiskDB Team
repo_url: https://github.com/Rashid2G/whiskdb
repo_name: Rashid2G/whiskdb

theme:
  name: mkdocs
  color_mode: dark
  user_color_mode_toggle: true

extra_css:
  - css/custom.css

markdown_extensions:
  - admonition
  - tables

nav:
  - Home: index.md
  - User Guide: user-guide.md
  - Development: development.md
  - Developer Guide: developer-guide.md
